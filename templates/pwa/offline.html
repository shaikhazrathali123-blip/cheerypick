{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090D">
  <title>Offline · CheeriPick</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("cp-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
  {# Cached by the service worker and shown when there's no connection, so it must not depend on who's logged in. #}
  <main class="container page">
    <div class="empty-state big">
      <div class="empty-emoji">📡</div>
      <h1>You're offline</h1>
      <p class="muted">No connection right now. Your matches and chats will be right here when you're back.</p>
      <button class="btn btn-primary" type="button" onclick="location.reload()">Try again</button>
    </div>
  </main>
</body>
</html>
