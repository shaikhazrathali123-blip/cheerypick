{% load cheeri %}
<nav class="tabbar" aria-label="Tabs">
  <a class="{% active '/deck' %}" href="{% url 'matching:deck' %}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="12" height="16" rx="2.5" transform="rotate(10 13 11)"/><rect x="4" y="5" width="12" height="16" rx="2.5"/></svg>
    <span>Swipe</span>
  </a>
  <a class="{% active '/discover' %}" href="{% url 'matching:discover' %}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <span>Discover</span>
  </a>
  <a class="{% active '/quick-pick' %}" href="{% url 'matching:quick_pick' %}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9.5 12.5l2 2 3.5-4"/></svg>
    <span>Pick</span>
  </a>
  <a class="{% active '/matches' '/chat' %}" href="{% url 'matching:matches' %}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>
    <span>Chats</span>
    {% if unread_count %}<b class="count-badge" data-unread>{{ unread_count }}</b>{% endif %}
  </a>
  {% if user.is_host %}
  <a class="{% active '/listings' %}" href="{% url 'listings:mine' %}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3z"/><path d="M10 20v-5h4v5"/></svg>
    <span>Rooms</span>
  </a>
  {% endif %}
  <a class="{% active '/accounts/settings' '/accounts/onboarding' %}" href="{% url 'accounts:settings' %}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
    <span>Me</span>
  </a>
</nav>
